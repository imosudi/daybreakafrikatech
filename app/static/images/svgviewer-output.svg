<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient defined based on the logo in source [3] -->
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#23B5D3;stop-opacity:1" /> <!-- Cyan/Teal -->
      <stop offset="100%" style="stop-color:#4A22D6;stop-opacity:1" /> <!-- Royal Blue/Purple -->
    </linearGradient>
  </defs>

  <!-- Grouped elements rotated to match the diagonal orientation in the source -->
  <g transform="rotate(-45 250 250)">
    
    <!-- Left Column -->
    <rect x="120" y="200" width="40" height="120" rx="20" fill="url(#logo-gradient)" />
    
    <!-- Second Column -->
    <rect x="180" y="140" width="40" height="240" rx="20" fill="url(#logo-gradient)" />
    
    <!-- Center Column (Broken) -->
    <rect x="240" y="80" width="40" height="160" rx="20" fill="url(#logo-gradient)" />
    <rect x="240" y="260" width="40" height="160" rx="20" fill="url(#logo-gradient)" />
    
    <!-- Right Column + Dot -->
    <rect x="300" y="160" width="40" height="200" rx="20" fill="url(#logo-gradient)" />
    <circle cx="320" cy="100" r="25" fill="url(#logo-gradient)" />
    
    <!-- Far Right Column -->
    <rect x="360" y="220" width="40" height="100" rx="20" fill="url(#logo-gradient)" />
    
  </g>
</svg>