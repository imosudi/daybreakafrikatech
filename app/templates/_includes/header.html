<!--templates/_includes/header.html-->
<!-- ================= HEADER / NAV ================= -->
<header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">

            <!-- Brand / Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2"
               href="{{ url_for('main.home') }}">
                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="Daybreak Afrika Technologies logo"
                    width="36"
                    height="36"
                    class="img-fluid">
                <span class="fw-semibold">Daybreak Afrika</span>
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'main.home' %}active{% endif %}"
                           href="{{ url_for('main.home') }}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint and request.endpoint.startswith('solutions.') %}active{% endif %}"
                           href="{{ url_for('solutions.index') }}">
                            Solutions
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint and request.endpoint.startswith('developer.') %}active{% endif %}"
                           href="{{ url_for('developer.index') }}">
                            Developer Portal
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint and request.endpoint.startswith('ai.') %}active{% endif %}"
                           href="{{ url_for('ai.ai_home') }}">
                            AI Services
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint and request.endpoint.startswith('solution_finder.') %}active{% endif %}"
                           href="{{ url_for('solution_finder.solution_finder_page') }}">
                            Solution Finder
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>
