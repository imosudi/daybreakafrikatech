<!-- app/templates/_includes/header.html -->
<!-- ================= HEADER / NAV ================= -->
<header>
    <nav>
        <div class="nav-container">
            <a href="{{ url_for('main.home') }}" class="logo">
                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="Daybreak Afrika Technologies"
                    class="logo-img">
                <span>Daybreak Afrika</span>
            </a>

            <ul class="nav-links">
                <li>
                    <a href="{{ url_for('main.home') }}"
                       {% if request.endpoint == 'main.home' %}class="active"{% endif %}>
                        Home
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('solutions.index') }}"
                       {% if request.endpoint and request.endpoint.startswith('solutions.') %}class="active"{% endif %}>
                        Solutions
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('developer.index') }}"
                       {% if request.endpoint and request.endpoint.startswith('developer.') %}class="active"{% endif %}>
                        Developer Portal
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('ai.ai_home') }}"
                       {% if request.endpoint and request.endpoint.startswith('ai.') %}class="active"{% endif %}>
                        AI Services
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('solution_finder.solution_finder_page') }}"
                       {% if request.endpoint and request.endpoint.startswith('solution_finder.') %}class="active"{% endif %}>
                        Solution Finder
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>
