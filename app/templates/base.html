
<!--templates/base.html-->
<!DOCTYPE html>
<html lang="{{ g.locale | default('en') }}">
<head>
    <!-- ================= CORE META ================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{% block title %}Daybreak Afrika Technologies{% endblock %}</title>

    <meta name="description"
          content="Future-ready enterprise infrastructure, identity APIs, AI modelling, and secure digital systems.">
    <meta name="author" content="Daybreak Afrika Technologies">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- ================= PERFORMANCE HINTS ================= -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- ================= BOOTSTRAP CSS ================= -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

        <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


    <!-- ================= CUSTOM STYLES ================= -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <!-- ================= TIME / LOCALE ================= -->
    {{ moment.include_moment() }}

    {% block extra_css %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

<a href="#main-content" class="visually-hidden-focusable">
    Skip to main content
</a>

{% include '_includes/header.html' %}

<main id="main-content" role="main" class="flex-fill">
    {% block content %}{% endblock %}
</main>

{% include '_includes/footer.html' %}

<!-- ================= BOOTSTRAP JS (BUNDLE) ================= -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"
    defer></script>

{% block extra_js %}{% endblock %}
</body>
</html>
