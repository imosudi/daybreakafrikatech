<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Daybreak Afrika Technologies{% endblock %}</title>

    <meta name="description"
          content="Future-ready enterprise infrastructure, identity APIs, AI modelling, and secure digital systems.">
    <meta name="author" content="Daybreak Afrika Technologies">

    <!-- ================= BOOTSTRAP CSS ================= -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- ================= CUSTOM STYLES ================= -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>

<!-- ================= HEADER / NAV ================= -->
{% include '_includes/header.html' %}

<!-- ================= MAIN CONTENT ================= -->
<main role="main">
    {% block content %}{% endblock %}
</main>
<!-- ================= FOOTER ================= -->
{% include '_includes/footer.html' %}

<!-- ================= BOOTSTRAP JS ================= -->
<script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"
    defer></script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"
    defer></script>

{% block extra_js %}{% endblock %}

</body>
</html>
